[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cynar"
version = "0.1.0"
description = "CYNAR: Computation Yields Nonequilibrium Analysis and Reconstruction — entropy production estimation for overdamped diffusive systems from trajectory data."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Marco Baiesi" },
    { name = "Ivan Di Terlizzi" },
]
license = { text = "MIT" }
dependencies = [
    "numpy",
    "scipy",
    "numba",
    "scikit-learn",
    "matplotlib",
    "tabulate",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
